name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  VM_HOST: ${{ vars.VM_HOST || '34.200.249.158' }}
  VM_USER: ${{ vars.VM_USER || 'ec2-user' }}

jobs:
  backend:
    name: Backend - build, test, scan, package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build
        run: ./mvnw -B -ntp clean compile

      - name: Test
        run: ./mvnw -B -ntp test

      - name: Publish test report to job summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET

          files = sorted(glob.glob("target/surefire-reports/TEST-*.xml"))
          print("## Backend test report\n")
          if not files:
              print("No test reports found (build may have failed before tests ran).")
              raise SystemExit
          rows, failures = [], []
          tot = dict(tests=0, failures=0, errors=0, skipped=0)
          for f in files:
              s = ET.parse(f).getroot()
              c = {k: int(s.get(k, 0)) for k in tot}
              for k in tot:
                  tot[k] += c[k]
              rows.append((s.get("name"), c))
              for tc in s.iter("testcase"):
                  for kind in ("failure", "error"):
                      e = tc.find(kind)
                      if e is not None:
                          msg = (e.get("message") or "").replace("\n", " ")[:300]
                          failures.append((tc.get("classname"), tc.get("name"), msg))
          passed = tot["tests"] - tot["failures"] - tot["errors"] - tot["skipped"]
          icon = "❌" if tot["failures"] or tot["errors"] else "✅"
          print(f"{icon} **{tot['tests']}** tests: **{passed}** passed, **{tot['failures']}** failed, **{tot['errors']}** errors, **{tot['skipped']}** skipped\n")
          print("| Test class | Tests | Passed | Failed | Errors | Skipped |")
          print("|---|---|---|---|---|---|")
          for name, c in rows:
              p = c["tests"] - c["failures"] - c["errors"] - c["skipped"]
              print(f"| {name} | {c['tests']} | {p} | {c['failures']} | {c['errors']} | {c['skipped']} |")
          if failures:
              print("\n### Failures\n")
              for cls, n, msg in failures:
                  print(f"- `{cls}.{n}`: {msg}")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surefire-reports-${{ github.sha }}
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: SonarQube quality check
        # Secrets are not exposed to fork PRs, so skip there.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: >
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar
          -Dsonar.host.url="$SONAR_HOST_URL"
          -Dsonar.projectKey="$SONAR_PROJECT_KEY"
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300

      - name: Package executable jar
        run: ./mvnw -B -ntp package -DskipTests

      - name: Verify jar is executable
        run: |
          jar=$(ls target/ecommerce-*.jar | grep -v '\.original$' | head -n1)
          unzip -p "$jar" META-INF/MANIFEST.MF | grep -q '^Main-Class: org.springframework.boot.loader'
          echo "JAR_PATH=$jar" >> "$GITHUB_ENV"

      - name: Upload jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-jar-${{ github.sha }}
          path: backend/${{ env.JAR_PATH }}
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend - build, lint, scan, package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # Runs tsc -b (type check) followed by vite build
      - name: Type check and build
        run: npm run build

      - name: SonarQube quality check
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_FRONTEND_PROJECT_KEY }}
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Build summary
        run: |
          {
            echo "## Frontend build"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- dist size: $(du -sh dist | cut -f1)"
            echo "- Files: $(find dist -type f | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Docker images to GHCR
    needs: [backend, frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.prefix.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Compute lowercase image prefix
        id: prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.prefix.outputs.value }}/oakline-backend:${{ github.sha }}
            ${{ steps.prefix.outputs.value }}/oakline-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.prefix.outputs.value }}/oakline-frontend:${{ github.sha }}
            ${{ steps.prefix.outputs.value }}/oakline-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to AWS VM
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: http://${{ vars.VM_HOST || '34.200.249.158' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Deploy containers
        env:
          IMAGE_PREFIX: ${{ needs.publish.outputs.image_prefix }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          # Secrets travel over stdin so they never appear in a process list.
          {
            for v in IMAGE_PREFIX IMAGE_TAG GHCR_USER GHCR_TOKEN DB_PASSWORD JWT_SECRET; do
              printf 'export %s=%q\n' "$v" "${!v}"
            done
            cat <<'REMOTE'
          set -euo pipefail
          BACKEND_IMAGE="$IMAGE_PREFIX/oakline-backend:$IMAGE_TAG"
          FRONTEND_IMAGE="$IMAGE_PREFIX/oakline-frontend:$IMAGE_TAG"

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker pull "$BACKEND_IMAGE"
          docker pull "$FRONTEND_IMAGE"
          docker network inspect ecommerce-net >/dev/null 2>&1 || docker network create ecommerce-net

          # Postgres keeps running across deploys; data lives in a named volume.
          if ! docker ps --format '{{.Names}}' | grep -qx ecommerce-postgres; then
            docker rm -f ecommerce-postgres >/dev/null 2>&1 || true
            docker run -d --name ecommerce-postgres --restart unless-stopped \
              --network ecommerce-net \
              -e POSTGRES_DB=ecommerce -e POSTGRES_USER=ecommerce -e POSTGRES_PASSWORD="$DB_PASSWORD" \
              -v ecommerce_pgdata:/var/lib/postgresql/data \
              postgres:16-alpine
          fi
          for i in $(seq 1 30); do
            docker exec ecommerce-postgres pg_isready -U ecommerce -d ecommerce && break
            sleep 2
          done

          docker rm -f ecommerce-backend ecommerce-frontend >/dev/null 2>&1 || true

          docker run -d --name ecommerce-backend --restart unless-stopped \
            --network ecommerce-net --network-alias backend \
            --security-opt no-new-privileges:true \
            -e DB_URL=jdbc:postgresql://ecommerce-postgres:5432/ecommerce \
            -e DB_USERNAME=ecommerce -e DB_PASSWORD="$DB_PASSWORD" -e JWT_SECRET="$JWT_SECRET" \
            -p 8080:8080 "$BACKEND_IMAGE"

          for i in $(seq 1 40); do
            curl -fsS http://localhost:8080/api/health >/dev/null && break
            if [ "$i" = 40 ]; then docker logs --tail 100 ecommerce-backend; echo "Backend unhealthy"; exit 1; fi
            sleep 5
          done

          docker run -d --name ecommerce-frontend --restart unless-stopped \
            --network ecommerce-net \
            --security-opt no-new-privileges:true \
            -p 80:8080 "$FRONTEND_IMAGE"

          for i in $(seq 1 20); do
            curl -fsS http://localhost/api/health >/dev/null && break
            if [ "$i" = 20 ]; then docker logs --tail 50 ecommerce-frontend; echo "Frontend unhealthy"; exit 1; fi
            sleep 3
          done

          docker logout ghcr.io
          docker image prune -f
          docker ps
          REMOTE
          } | ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "$VM_USER@$VM_HOST" 'bash -s'

  e2e-tests:
    name: E2E tests (Playwright)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: test-pw
    env:
      BASE_URL: http://${{ vars.VM_HOST || '34.200.249.158' }}
      API_BASE_URL: http://${{ vars.VM_HOST || '34.200.249.158' }}/api
      DEMO_USERNAME: ${{ vars.DEMO_USERNAME || 'demo' }}
      DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD || 'password1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test-pw/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Seed test users
        run: bash scripts/seed-test-users.sh

      - name: Run all test cases
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            test-pw/playwright-report/
            test-pw/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean up test users
        if: always()
        env:
          SSH_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          VM_HOST="$VM_HOST" VM_USER="$VM_USER" SSH_KEY_FILE=~/.ssh/id_deploy bash scripts/cleanup-test-users.sh
