name: Backend CI

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build
        run: ./mvnw -B -ntp clean compile

      - name: Test
        run: ./mvnw -B -ntp test

      - name: Publish test report to job summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, os
          import xml.etree.ElementTree as ET

          files = sorted(glob.glob("target/surefire-reports/TEST-*.xml"))
          print("## Backend test report\n")
          if not files:
              print("No test reports found (build may have failed before tests ran).")
              raise SystemExit
          rows, failures = [], []
          tot = dict(tests=0, failures=0, errors=0, skipped=0)
          for f in files:
              s = ET.parse(f).getroot()
              c = {k: int(s.get(k, 0)) for k in tot}
              for k in tot:
                  tot[k] += c[k]
              name = s.get("name")
              rows.append((name, c))
              for tc in s.iter("testcase"):
                  for kind in ("failure", "error"):
                      e = tc.find(kind)
                      if e is not None:
                          msg = (e.get("message") or "").replace("\n", " ")[:300]
                          failures.append((tc.get("classname"), tc.get("name"), msg))
          passed = tot["tests"] - tot["failures"] - tot["errors"] - tot["skipped"]
          icon = "❌" if tot["failures"] or tot["errors"] else "✅"
          print(f"{icon} **{tot['tests']}** tests: **{passed}** passed, **{tot['failures']}** failed, **{tot['errors']}** errors, **{tot['skipped']}** skipped\n")
          print("| Test class | Tests | Passed | Failed | Errors | Skipped |")
          print("|---|---|---|---|---|---|")
          for name, c in rows:
              p = c["tests"] - c["failures"] - c["errors"] - c["skipped"]
              print(f"| {name} | {c['tests']} | {p} | {c['failures']} | {c['errors']} | {c['skipped']} |")
          if failures:
              print("\n### Failures\n")
              for cls, n, msg in failures:
                  print(f"- `{cls}.{n}`: {msg}")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surefire-reports-${{ github.sha }}
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: SonarQube quality check
        # Secrets are not exposed to fork PRs, so skip there.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: >
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar
          -Dsonar.host.url="$SONAR_HOST_URL"
          -Dsonar.projectKey="$SONAR_PROJECT_KEY"
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300

      - name: Package executable jar
        run: ./mvnw -B -ntp package -DskipTests

      - name: Verify jar is executable
        run: |
          jar=$(ls target/ecommerce-*.jar | grep -v '\.original$' | head -n1)
          unzip -p "$jar" META-INF/MANIFEST.MF | grep -q '^Main-Class: org.springframework.boot.loader'
          echo "JAR_PATH=$jar" >> "$GITHUB_ENV"

      - name: Upload jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-jar-${{ github.sha }}
          path: backend/${{ env.JAR_PATH }}
          if-no-files-found: error
          retention-days: 14
