name: Backend CI

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build
        run: ./mvnw -B -ntp clean compile

      - name: Test
        run: ./mvnw -B -ntp test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surefire-reports-${{ github.sha }}
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Package executable jar
        run: ./mvnw -B -ntp package -DskipTests

      - name: Verify jar is executable
        run: |
          jar=$(ls target/ecommerce-*.jar | grep -v '\.original$' | head -n1)
          unzip -p "$jar" META-INF/MANIFEST.MF | grep -q '^Main-Class: org.springframework.boot.loader'
          echo "JAR_PATH=$jar" >> "$GITHUB_ENV"

      - name: Upload jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-jar-${{ github.sha }}
          path: backend/${{ env.JAR_PATH }}
          if-no-files-found: error
          retention-days: 14
